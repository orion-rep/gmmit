# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Gmmit CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Test
      run: make test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Build
      run: make build

  pages:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Assemble site
      run: |
        mkdir -p _site/images
        cp site/index.html _site/index.html
        cp site/CNAME _site/CNAME
        cp scripts/install.sh _site/install.sh
        cp images/commit.gif _site/images/commit.gif

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Build cross-platform binaries
      run: |
        VERSION=${GITHUB_REF_NAME}
        build() {
          OS=$1; ARCH=$2
          echo "[INFO] Building for ${OS} (${ARCH})"
          env GOOS=${OS} GOARCH=${ARCH} go build \
            -ldflags "-X main.Version=${VERSION}" \
            -o build/${OS}-${ARCH}/gmmit \
            ./cmd/gmmit/
          tar -czf build/${OS}-${ARCH}.tgz --directory=build/${OS}-${ARCH} gmmit
          rm -rf build/${OS}-${ARCH}
        }
        build darwin arm64
        build darwin amd64
        build linux 386
        build linux amd64
        build windows 386
        build windows amd64

    - name: Generate changelog
      run: |
        VERSION=${GITHUB_REF_NAME} \
        DATE=$(date -u +%Y-%m-%d) \
        REPO=${{ github.repository }} \
        bash scripts/changelog.sh > /tmp/release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.tgz
        body_path: /tmp/release_notes.md

